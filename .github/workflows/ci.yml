name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        continue-on-error: true # Don't block for now as project is in development
        
      - name: Unit Tests
        run: npm run test:unit
        
      - name: Security Rules Tests
        run: npm run test:rules
        
      - name: Build
        run: npm run build
        
      - name: E2E Tests
        run: npx playwright test
